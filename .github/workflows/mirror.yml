name: Sync Gitee → GitHub
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mirror Gitee to GitHub
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          source_repo_url: https://gitee.com/jixukong/jieyou-embed-board.git
          target_repo_url: https://github.com/XukongJi/embed-board.git
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
