name: Sync Gitee → GitHub
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 执行git镜像同步
        run: |
          git config --global user.name "mirror-bot"
          git config --global user.email "mirror@example.com"
          # 裸克隆Gitee仓库，带上GITEE_TOKEN认证
          git clone --bare https://${{ secrets.GITEE_TOKEN }}@gitee.com/jixukong/jieyou-embed-board.git ./mirror.git
          cd ./mirror.git
          # 推送到github目标仓库，使用内置GITHUB_TOKEN
          git remote add github https://${{ github.TOKEN }}@github.com/XukongJi/embed-board.git
          git push --mirror github
